name: Build Sarfealam Studio v2 APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract Studio ZIP & Install Capacitor Android
        run: |
          ZIP_FILE=$(ls -1 *.zip | head -n 1)
          echo "Using ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d unpacked_app
          cp -r unpacked_app/* .
          rm -rf unpacked_app
          npm install --legacy-peer-deps
          npm install @capacitor/android@^8.6.2 --legacy-peer-deps

      - name: Build Web Bundle & Add Android
        run: |
          npm run build
          rm -rf android
          npx cap add android

      - name: Inject Android Mic, Camera & Speech Queries Permissions
        run: |
          python3 - << 'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          txt = open(p, 'r', encoding='utf-8').read()
          perms = '\n'.join([
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '    <queries>',
              '        <intent><action android:name="android.speech.RecognitionService" /></intent>',
              '        <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>',
              '    </queries>',
          ])
          if 'RECORD_AUDIO' not in txt:
              txt = txt.replace('<application', perms + '\n    <application', 1)
              open(p, 'w', encoding='utf-8').write(txt)
              print('Injected Mic, Camera & Speech/TTS permissions!')
          PY
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish Studio v2 APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Sarfealam Auto-Studio v2.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
